name: CI

on:
  push:
    branches: [branch_libev, master, baseline]
  pull_request:
    branches: [branch_libev, master]

permissions:
  contents: write
  deployments: write

jobs:
  test-and-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run correctness tests
        run: make test

      - name: Build benchmarks
        run: make bench

      - name: Run benchmarks
        run: ./bench_udpspeeder

      - name: Run benchmarks (JSON)
        run: ./bench_udpspeeder --json

      - name: Store benchmark results
        if: github.ref == 'refs/heads/branch_libev' || github.ref == 'refs/heads/baseline'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: UDPspeeder Benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: dev/bench
